document.addEventListener('visibilitychange',()=>{last=performance.now();save()});window.addEventListener('pagehide',save);
$('exit').onclick=()=>go(state.location==='map'?state.lastLocation:'map');$('back').onclick=()=>{if(navHistory.length){state.location=navHistory.pop();stamp='';save();render()}};
$('pause').onclick=()=>{state.paused=!state.paused;last=performance.now();render();save()};$('calendar-button').onclick=openCalendar;$('calendar-close').onclick=closeCalendar;
$('calendar-overlay').onclick=e=>{if(e.target===$('calendar-overlay'))closeCalendar()};
$('calendar-prev').onclick=()=>{const d=calendarMonth||date();calendarMonth=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1));renderCalendar()};
$('calendar-next').onclick=()=>{const d=calendarMonth||date();calendarMonth=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));renderCalendar()};
$('calendar-today').onclick=()=>{calendarMonth=null;renderCalendar()};
$('sleep').onclick=()=>{const d=date();let next=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),8);if(next<=state.time)next+=86400000;state.time=next;fraction=0;last=performance.now();stamp='';render();save()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen()}catch{}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(calendarOpen)closeCalendar();else go(state.location==='map'?state.lastLocation:'map')}if(calendarOpen&&e.key==='Tab'){const list=[...$('calendar-overlay').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});
for(let i=0;i<65;i++){const x=document.createElement('i');x.style.cssText=`left:${(i*37)%100}%;top:${-20+(i*13)%120}%;animation-delay:-${i%9}s;animation-duration:${2+i%5}s`;$('weather-fx').append(x)}
window.gameDebug={setTime(t){state.time=typeof t==='string'?Date.parse(t):t;stamp='';render();save()},go,seasonOf,periodOf,weatherOf,advance,getState:()=>({...state}),openCalendar};render();

</script></body></html>
