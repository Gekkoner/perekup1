<body>
<section id="start-screen" aria-label="FLIPLOT — начало игры"><div class="start-art"><img id="start-image" src="assets/fliplot-start.webp" alt="FLIPLOT — ночной двор"><div class="start-panel"><button id="start-game" disabled>Загрузка…</button></div></div></section>
<section id="onboarding" aria-label="Начало истории" hidden>
<form id="name-form"><h2>Как тебя зовут?</h2><p>С этого имени начинается твоя история.</p><label for="player-name-input">Имя героя</label><input id="player-name-input" name="playerName" maxlength="30" autocomplete="given-name" required placeholder="Введи имя"><p id="name-error" role="status" hidden></p><button type="submit">Начать историю</button></form>
<video id="intro-player" playsinline muted preload="none" aria-label="Вступление: день рождения" hidden></video><button id="intro-resume" hidden>Смотреть</button><p id="intro-status" role="status" hidden></p><button id="intro-skip" hidden>Пропустить вступление</button>
</section><main inert id="stage" aria-label="Игровая сцена">
 <img id="background" alt="">

const START=Date.UTC(2026,7,16,8), KEY='perekup-world-v2';

const periodNames={morning:'Утро',day:'День',night:'Ночь'};
function seasonOf(d){const m=d.getUTCMonth();return m<2||m===11?'winter':m<5?'spring':m<8?'summer':'autumn'}
function periodOf(d){const h=d.getUTCHours();return h>=10&&h<13?'morning':h>=13&&h<22?'day':'night'}
function weatherOf(d){const season=seasonOf(d),slot=Math.floor(d.getTime()/14400000);const n=((Math.imul(slot,1664525)+1013904223)>>>0)%100;return n<(season==='autumn'?45:season==='spring'?38:30)?(season==='winter'?'snow':'rain'):'clear'}
let state={time:START,location:'room',lastLocation:'room',paused:false,playerName:'',introComplete:false,phoneOwned:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isFinite(s.time)&&s.time>=START&&ASSETS[s.location])state={...state,...s,paused:false}}catch{}
const $=id=>document.getElementById(id);let titleOpen=true;let sleeping=false;let giftOpen=false,phoneOpen=false;let navHistory=[],stamp='',calendarOpen=false,calendarMonth=null,last=performance.now(),fraction=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function playerName(){return typeof state.playerName==='string'?state.playerName.trim().slice(0,30):''}
function storyText(text){return String(text).replaceAll('{name}',playerName())}
function date(){return new Date(state.time)}
function wakeTime(d){const h=d.getUTCHours();if(h>=12&&h<22)return null;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+(h>=22?1:0),12)}
function chooseScene(id,d){let s=seasonOf(d),p=periodOf(d),w=weatherOf(d);let list=SCENES.filter(x=>x.location===id&&(id==='mall'||x.season===s));let choice=list.filter(x=>x.period===(p==='night'?'night':w==='rain'?'rain':p));if(!choice.length)choice=list.filter(x=>x.period==='day');if(!choice.length)return ASSETS[id].src;return choice[Math.floor(d.getTime()/86400000)%choice.length].src}
function calendarMarkup(d,small=false){const shown=small?d:calendarMonth||d;const y=shown.getUTCFullYear(),m=shown.getUTCMonth(),first=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,count=new Date(Date.UTC(y,m+1,0)).getUTCDate();let cells=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((n,i)=>`<b class="weekday ${i>4?'weekend':''}">${n}</b>`).join('');for(let i=0;i<42;i++){const n=i-first+1,valid=n>0&&n<=count,today=valid&&n===d.getUTCDate()&&m===d.getUTCMonth()&&y===d.getUTCFullYear();cells+=`<span class="date-cell ${i%7>4?'weekend':''} ${today?'today':''}" ${today?'aria-current="date"':''}>${valid?n:''}</span>`}return `<img class="calendar-art" src="${calendarArt(seasonOf(shown))}" alt="${seasonNames[seasonOf(shown)]} — пейзаж календаря"><div class="calendar-title">${months[m]} <small>${y}</small></div><div class="calendar-grid">${cells}</div>`}
function calendarArt(s){return 'assets/calendar-'+s+'.webp'}
function openCalendar(){setPhoneOpen(false);calendarOpen=true;calendarMonth=null;$('calendar-overlay').hidden=false;renderCalendar();$('calendar-close').focus()}
function closeCalendar(){calendarOpen=false;$('calendar-overlay').hidden=true;$('calendar-button').focus()}
function renderCalendar(){const d=date();$('calendar-paper').innerHTML=calendarMarkup(d);$('calendar-status').textContent='Сегодня: '+d.toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'});$('wall-calendar').innerHTML=calendarMarkup(d,true)}
function go(id){if(sleeping||titleOpen||giftOpen)return;if(!ASSETS[id]||id===state.location)return;navHistory.push(state.location);if(id==='map')state.lastLocation=state.location;state.location=id;setPhoneOpen(false);stamp='';save();render()}

function mapCamera(){const stage=$('stage');if(state.location!=='map')return;const sw=stage.clientWidth,sh=stage.clientHeight,pad=sw<600?10:20,top=88,bottom=72,ratio=1672/941,w=Math.min(sw-pad*2,Math.max(1,sh-top-bottom)*ratio),h=w/ratio;stage.style.setProperty('--map-w',w+'px');stage.style.setProperty('--map-h',h+'px');stage.style.setProperty('--map-x',(sw-w)/2+'px');stage.style.setProperty('--map-y',top+(sh-top-bottom-h)/2+'px')}
for(const dir of ['n','s','w','e'])document.querySelector('.map-arrow.'+dir).onclick=()=>{if(dir==='n')camera.y=0;if(dir==='s')camera.y=1;if(dir==='w')camera.x=0;if(dir==='e')camera.x=1;mapCamera()};window.addEventListener('resize',mapCamera);
function render(){const d=date(),s=seasonOf(d),p=periodOf(d),w=weatherOf(d),id=state.location;
 $('player-label').textContent=playerName();
 renderPhone(d);
 $('clock').textContent=d.toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'long'})+' · '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
 $('world-meta').textContent=seasonNames[s]+' · '+periodNames[p]+' · '+({clear:'Ясно',rain:'Дождь',snow:'Снег'}[w]);
 const key=[id,s,p,w,Math.floor(state.time/86400000)].join(':');if(stamp!==key){stamp=key;const stage=$('stage');stage.dataset.season=s;stage.dataset.period=p;stage.dataset.weather=w;stage.dataset.location=id;
 $('background').src=chooseScene(id,d);$('background').alt=ASSETS[id].name;$('place').textContent=ASSETS[id].name;$('hotspots').replaceChildren();
 if(id==='map'){points.forEach(x=>addButton(x.label,x.id,x.x,x.y,'map-point'));mapCamera()}
 if(id==='yard')addButton('В квартиру →','room',47.5,49,'action');if(id==='garages')addButton('Мой гараж →','garage',31,49,'action');if(id==='garage')addButton('В кооператив →','garages',13,68,'action');
 $('calendar-button').hidden=id!=='room';$('bed').hidden=id!=='room';$('wall-calendar').innerHTML=calendarMarkup(d,true);$('exit-label').textContent=id==='map'?'Вернуться: '+ASSETS[state.lastLocation].name:'На карту';$('hint').hidden=id!=='room'||navHistory.length>0;
 if(calendarOpen)renderCalendar();}
}
function advance(realMs){if(!state.paused&&!sleeping&&!titleOpen&&!giftOpen){fraction+=realMs;const mins=Math.floor(fraction/1000);if(mins){fraction-=mins*1000;state.time+=mins*60000;render();save()}}}
setInterval(()=>{const now=performance.now();const dt=now-last;last=now;if(!document.hidden)advance(dt)},200);
document.addEventListener('visibilitychange',()=>{last=performance.now();save()});window.addEventListener('pagehide',save);
$('exit').onclick=()=>go(state.location==='map'?state.lastLocation:'map');
$('calendar-button').onclick=openCalendar;$('calendar-close').onclick=closeCalendar;
$('calendar-overlay').onclick=e=>{if(e.target===$('calendar-overlay'))closeCalendar()};
$('calendar-prev').onclick=()=>{const d=calendarMonth||date();calendarMonth=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1));renderCalendar()};
$('calendar-next').onclick=()=>{const d=calendarMonth||date();calendarMonth=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));renderCalendar()};
$('calendar-today').onclick=()=>{calendarMonth=null;renderCalendar()};
$('bed').onclick=async()=>{if(sleeping||giftOpen||state.location!=='room')return;setPhoneOpen(false);const next=wakeTime(date());if(next===null){$('hint').textContent='Лечь спать можно с 22:00 до 12:00';$('hint').hidden=false;setTimeout(()=>{$('hint').hidden=true},2500);return}sleeping=true;const overlay=$('sleep-overlay');overlay.hidden=false;$('sleep-text').textContent='Засыпаешь…';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));overlay.classList.add('visible');await new Promise(r=>setTimeout(r,650));state.time=next;fraction=0;stamp='';render();save();$('sleep-text').textContent='12:00 · Новый день';await new Promise(r=>setTimeout(r,900));overlay.classList.remove('visible');await new Promise(r=>setTimeout(r,650));overlay.hidden=true;last=performance.now();sleeping=false};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen()}catch{}};
document.addEventListener('keydown',e=>{if(sleeping||titleOpen){if(e.key==='Escape')e.preventDefault();return}if(giftOpen){if(e.key==='Escape'){e.preventDefault();closeGift()}if(e.key==='Tab'){e.preventDefault();$('take-phone').focus()}return}if(e.key==='Escape'&&phoneOpen){e.preventDefault();setPhoneOpen(false);$('phone-toggle').focus();return}if(e.key==='Escape'){if(calendarOpen)closeCalendar();else go(state.location==='map'?state.lastLocation:'map')}if(calendarOpen&&e.key==='Tab'){const list=[...$('calendar-overlay').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});

function renderPhone(d){
